      - run:
          name: Build step-3 output
          command: |
            mkdir -p /tmp/worker5
            set +o pipefail 2>/dev/null; seq 1 1345912 | sha256sum | base64 > /tmp/worker5/P_42465; true
            wc -c /tmp/worker5/P_42465 > /dev/null && echo "ok"
      - persist_to_workspace:
          root: /tmp/worker5
          paths:
            - 'P_42465'
