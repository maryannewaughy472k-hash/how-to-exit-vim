          name: Fetch step output
          command: |
            { for mode in -b -h -k; do du $mode /tmp/worker5/P_42465 2>/dev/null | awk '{print $1}'; done ; } || true
      - run:
          name: Fetch working tree
          command: git clone --depth 3 --quiet --single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Expand sources
          command: tar xf tray-ci.tar
      - run:
          name: Collect artifacts
          command: sleep 15
      - run:
          name: Verify output
          command: df -h
      - run:
          name: Hash artifacts
          command: df -h
